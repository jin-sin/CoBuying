# cobuying-web nginx 설정 사본
# 실제 위치: NAS /volume1/docker/cobuying-web/nginx.conf
#   (컨테이너 /etc/nginx/conf.d/default.conf 에 ro 마운트,
#    수정 후 docker exec cobuying-web nginx -s reload)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 셀러 전용 판매 링크. Flutter 웹이 해시 라우팅(#/...)이라 그대로 두면
    # 공유용 주소가 /#/s/foo 가 된다. 인스타 프로필에 걸 주소라 짧고 깨끗해야
    # 해서 /s/foo 로 받아 해시 라우트로 넘긴다.
    # 정규식의 {1,19}는 nginx가 블록 괄호로 읽어버리므로 따옴표로 감싼다
    location ~ "^/s/([a-z0-9][a-z0-9-]{1,19})/?$" {
        # 이 컨테이너는 평문 80으로 받는다(앞단이 DSM 역방향 프록시 + Cloudflare).
        # 기본값이면 nginx가 Location을 http:// 절대주소로 만들어 HTTPS 손님을
        # 평문으로 한 번 튕긴다. 상대 경로로 내보내 브라우저가 현재 origin에 붙이게 한다.
        absolute_redirect off;
        return 302 /#/s/$1;
    }

    # 파일명에 해시가 없고 서비스워커도 안 쓰므로 항상 ETag로 재검증.
    # (변경 없으면 304 응답이라 전송량 부담 거의 없음)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
