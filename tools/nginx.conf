# cobuying-web nginx 설정 사본
# 실제 위치: NAS /volume1/docker/cobuying-web/nginx.conf
#   (컨테이너 /etc/nginx/conf.d/default.conf 에 ro 마운트,
#    수정 후 docker exec cobuying-web nginx -s reload)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── 공유되는 공개 경로를 해시 라우트로 넘긴다 ──────────────────────────
    # Flutter 웹이 해시 라우팅(#/...)이라 그대로 두면 공유 주소가 /#/partner 처럼
    # 된다. 밖에 뿌릴 링크라 짧고 깨끗해야 해서 nginx에서 받아 넘긴다.
    # 앱 안에서만 쓰는 경로(/cart, /orders, /seller ...)는 공유 대상이 아니라
    # 일부러 뺐다 — 규칙이 늘수록 정적 파일 경로와 부딪힐 위험만 커진다.
    #
    # 주의 1: 정규식의 {1,19}는 nginx가 블록 괄호로 읽으므로 따옴표로 감싼다.
    # 주의 2: 이 컨테이너는 평문 80으로 받는다(앞단이 DSM 역방향 프록시 +
    #   Cloudflare). absolute_redirect가 켜져 있으면 nginx가 Location을 http://
    #   절대주소로 만들어 HTTPS 손님을 평문으로 한 번 튕긴다.

    # 셀러 전용 판매 링크 (인스타 프로필·카톡 채널에 거는 주소)
    location ~ "^/s/([a-z0-9][a-z0-9-]{1,19})/?$" {
        absolute_redirect off;
        return 302 /#/s/$1;
    }

    # 상품 상세 — 셀러가 특정 공구를 콕 집어 공유하는 링크 (id는 uuid)
    location ~ "^/product/([0-9a-fA-F-]{36})/?$" {
        absolute_redirect off;
        return 302 /#/product/$1;
    }

    # 입점 안내와 법적 고지 — 로그인 없이 열리는 공개 페이지
    location ~ "^/(partner|info|terms|privacy|business)/?$" {
        absolute_redirect off;
        return 302 /#/$1;
    }

    # 파일명에 해시가 없고 서비스워커도 안 쓰므로 항상 ETag로 재검증.
    # (변경 없으면 304 응답이라 전송량 부담 거의 없음)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
